<script src="shared.js"></script>
<script>
var ITEMS=[
  {id:'aapl', label:'Apple',    sym:'AAPL',  sub:'NASDAQ', link:'https://finance.yahoo.com/quote/AAPL/'},
  {id:'msft', label:'Microsoft',sym:'MSFT',  sub:'NASDAQ', link:'https://finance.yahoo.com/quote/MSFT/'},
  {id:'nvda', label:'NVIDIA',   sym:'NVDA',  sub:'NASDAQ', link:'https://finance.yahoo.com/quote/NVDA/'},
  {id:'googl',label:'Alphabet', sym:'GOOGL', sub:'NASDAQ', link:'https://finance.yahoo.com/quote/GOOGL/'},
  {id:'amzn', label:'Amazon',   sym:'AMZN',  sub:'NASDAQ', link:'https://finance.yahoo.com/quote/AMZN/'}
];
var currentTF='1d', chartRef={instance:null}, selectedItem=null;

function buildGrid(){
  var grid=document.getElementById('grid-stocks');
  grid.innerHTML='';
  ITEMS.forEach(function(it){
    var el=document.createElement('div');
    el.className='ticker-item';
    el.innerHTML=
      '<span class="ext-icon">↗</span>'+
      '<span class="t-pair">'+it.label+'</span>'+
      (it.sub?'<span style="font-size:.54rem;color:var(--muted)">'+it.sub+'</span>':'')+
      (it.unit?'<span class="t-unit">'+it.unit+'</span>':'')+
      '<span class="t-rate" id="ir-'+it.id+'">…</span>'+
      '<span class="t-change flat" id="ic-'+it.id+'">—</span>'+
      '<span class="t-open" id="io-'+it.id+'"></span>'+
      '<canvas class="t-spark" id="is-'+it.id+'" height="28"></canvas>';
    el.addEventListener('click',function(){ selectedItem=it; showChart(it); });
    if(it.link) el.addEventListener('dblclick',function(){ window.open(it.link,'_blank'); });
    grid.appendChild(el);
  });
}
buildGrid();

document.getElementById('tf-stocks').addEventListener('click',function(e){
  if(!e.target.classList.contains('tf-btn')) return;
  document.querySelectorAll('#tf-stocks .tf-btn').forEach(function(b){b.classList.remove('active');});
  e.target.classList.add('active');
  currentTF=e.target.dataset.tf;
  fetchAll();
  if(selectedItem) showChart(selectedItem);
});

function fetchAll(){
  var tf=currentTF, tfCfg=TF_MAP[tf]||TF_MAP['1d'];
  var syms=ITEMS.map(function(it){return it.sym;});
  showSkeleton('grid-stocks', ITEMS.length);

  yahooFetchBatch(syms, tfCfg.range, tfCfg.interval, function(map){
    buildGrid();
    ITEMS.forEach(function(it){
      var result=map[it.sym]; if(!result) return;
      var meta=result.meta;
      var price=meta.regularMarketPrice||meta.previousClose; if(!price) return;
      var closes=[];
      if(result.indicators&&result.indicators.quote&&result.indicators.quote[0])
        closes=(result.indicators.quote[0].close||[]).filter(function(v){return v!==null;});
      var sliced=sliceForTF(closes,tf);
      var baseline=sliced.length>0?sliced[0]:(meta.regularMarketOpen||meta.chartPreviousClose||price);
      renderTickerCard({
        rateEl:  document.getElementById('ir-'+it.id),
        changeEl:document.getElementById('ic-'+it.id),
        openEl:  document.getElementById('io-'+it.id),
        sparkEl: document.getElementById('is-'+it.id),
        price:price, baseline:baseline, closes:sliced, isUSD:true
      });
    });
    document.getElementById('upd-stocks').textContent='Обновлено: '+new Date().toLocaleTimeString('ru-RU')+' · '+currentTF;
  });
}

function showChart(it){
  var tf=currentTF, tfCfg=TF_MAP[tf]||TF_MAP['1d'];
  document.getElementById('chart-stock-title').textContent=it.label+(it.unit?' ('+it.unit+')':'')+' · '+tf;
  document.getElementById('chart-card-stock').style.display='block';
  document.getElementById('chart-card-stock').scrollIntoView({behavior:'smooth',block:'center'});
  yahooFetch(it.sym,tfCfg.range,tfCfg.interval,function(result){
    if(!result) return;
    var closes=(result.indicators.quote[0].close||[]).filter(function(v){return v!==null;});
    var sliced=sliceForTF(closes,tf);
    var labels=makeLabels(result.timestamps,sliced.length,tf);
    renderLineChart('stockChart',labels,sliced,it.label,chartRef);
  });
}

fetchAll();
setInterval(fetchAll,5*60*1000);
</script></body></html>
